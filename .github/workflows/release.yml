name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual releases: creates the tag at the dispatched commit via
  # tauri-action, so a release can be cut (or re-run) without a tag push.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v2.2.0)"
        required: true
        type: string

permissions:
  contents: write

# Single release tag for all jobs: workflow_dispatch input, or the git tag that
# triggered the run. Must NOT fall back to github.ref_name alone on manual
# dispatch (that would be "main" and break notes/prune).
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-latest
    name: Lint, Typecheck & Test

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS (Apple Silicon)
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS (Intel)
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows (x64)

    runs-on: ${{ matrix.platform }}
    name: Build — ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: RuneWise ${{ env.RELEASE_TAG }}
          releaseBody: ""
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

  release-notes:
    needs: build
    runs-on: ubuntu-latest
    name: Update Release Notes

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          PREV_TAG=$(gh release list --limit 20 --json tagName --jq \
            --arg tag "$TAG" '[.[] | select(.tagName != $tag)] | .[0].tagName // empty')
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(gh api repos/${{ github.repository }}/releases/generate-notes \
              -f tag_name="$TAG" \
              -f previous_tag_name="$PREV_TAG" \
              --jq '.body')
          else
            NOTES="See CHANGELOG.md for details."
          fi
          gh release edit "$TAG" --notes "$NOTES"

  prune-old-releases:
    needs: release-notes
    runs-on: ubuntu-latest
    name: Prune Old Releases

    steps:
      - name: Delete all releases except the current tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: ${{ env.RELEASE_TAG }}
          REPO: ${{ github.repository }}
        run: |
          # Keep only the just-published release. Git tags are preserved (--cleanup-tag=false)
          # so history and commit-SHA lookups still work; only the release + binaries are removed.
          if [ -z "$CURRENT_TAG" ] || [ "$CURRENT_TAG" = "main" ] || [ "$CURRENT_TAG" = "master" ]; then
            echo "Refusing to prune: CURRENT_TAG='$CURRENT_TAG' is not a release tag"
            exit 1
          fi
          gh release list --repo "$REPO" --limit 100 --json tagName --jq '.[].tagName' \
            | grep -vxF "$CURRENT_TAG" \
            | while IFS= read -r tag; do
                echo "Deleting release $tag"
                gh release delete "$tag" --yes --cleanup-tag=false --repo "$REPO" || true
              done
